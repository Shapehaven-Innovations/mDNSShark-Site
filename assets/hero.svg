<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Shark fin rising from a glowing network graph">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="70%">
      <stop offset="0" stop-color="#0b2a44"/>
      <stop offset="1" stop-color="#06121f"/>
    </radialGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- network graph -->
  <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5" fill="none">
    <path d="M120 180 L300 120 L470 210 L650 110 L840 190 L1040 120"/>
    <path d="M300 120 L240 320 L470 210 L560 360 L650 110"/>
    <path d="M840 190 L760 340 L560 360 L470 210"/>
    <path d="M1040 120 L1000 330 L840 190"/>
    <path d="M240 320 L120 180"/>
    <path d="M760 340 L1000 330"/>
    <path d="M240 320 L330 470 M560 360 L600 470 M760 340 L880 470 M1000 330 L1100 470"/>
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="120" cy="180" r="7"/><circle cx="300" cy="120" r="9"/>
    <circle cx="470" cy="210" r="8"/><circle cx="650" cy="110" r="10"/>
    <circle cx="840" cy="190" r="8"/><circle cx="1040" cy="120" r="7"/>
    <circle cx="240" cy="320" r="7"/><circle cx="560" cy="360" r="9"/>
    <circle cx="760" cy="340" r="8"/><circle cx="1000" cy="330" r="7"/>
    <circle cx="330" cy="470" r="5"/><circle cx="600" cy="470" r="5"/>
    <circle cx="880" cy="470" r="5"/><circle cx="1100" cy="470" r="5"/>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-opacity=".5">
    <circle cx="650" cy="110" r="22"/><circle cx="650" cy="110" r="38" stroke-opacity=".25"/>
    <circle cx="560" cy="360" r="20"/>
  </g>

  <!-- water -->
  <rect y="520" width="1200" height="280" fill="url(#water)"/>
  <path d="M0 520 Q100 505 200 520 T400 520 T600 520 T800 520 T1000 520 T1200 520" fill="none" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M0 560 Q100 548 200 560 T400 560 T600 560 T800 560 T1000 560 T1200 560" fill="none" stroke="#22d3ee" stroke-opacity=".3" stroke-width="2"/>
  <path d="M0 610 Q100 600 200 610 T400 610 T600 610 T800 610 T1000 610 T1200 610" fill="none" stroke="#22d3ee" stroke-opacity=".15" stroke-width="2"/>

  <!-- fin -->
  <g filter="url(#glow)">
    <path d="M520 525 C585 495 640 390 690 250 C690 390 735 480 815 525 C760 510 705 508 665 520 C615 508 565 512 520 525 Z" fill="url(#fin)"/>
  </g>
  <!-- wake rings -->
  <ellipse cx="660" cy="528" rx="190" ry="14" fill="none" stroke="#22d3ee" stroke-opacity=".5"/>
  <ellipse cx="660" cy="532" rx="270" ry="22" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
  <ellipse cx="660" cy="538" rx="360" ry="30" fill="none" stroke="#22d3ee" stroke-opacity=".12"/>
</svg>
